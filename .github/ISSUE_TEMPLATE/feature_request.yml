name: Предложить функцию
description: Идея новой возможности или улучшения
title: "[Функция]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Что сейчас неудобно или невозможно сделать
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
    validations:
      required: false
