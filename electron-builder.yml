# Конфигурация упаковки и публикации. BLK-01 закрыт решением от 08.07.2026:
# релиз 1.0 выходит БЕЗ Code Signing Certificate (Artifact Signing недоступен
# для РФ, сторонние CA нестабильны) — см. Release_and_Update_Strategy.md §9.
# Целостность обновления проверяется через SHA-256/sha512 (electron-updater
# делает это по умолчанию через latest.yml, без цифровой подписи, UPD-03).
# Возврат к подписи (MSIX или публичный CA) рассматривается в 1.1+ — тогда
# здесь понадобятся win.signtoolOptions/certificateFile (ключ ВНЕ репозитория,
# SIGN-02) и publisherName ожидаемого издателя.
appId: app.lucidssh
productName: LucidSSH
directories:
  output: release
# 1024x1024 PNG — electron-builder сам генерирует .ico со всеми размерами.
icon: resources/icon.png
files:
  - out/**
  - assets/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Источник обновлений (OQ-08): публичный GitHub Releases, без токена (SIGN-02).
# owner/repo — плейсхолдеры, подставляются перед первым релизом. Из этого блока
# electron-builder генерирует app-update.yml, который читает electron-updater.
publish:
  provider: github
  owner: Xykyma
  repo: LucidSSH
  releaseType: release
